[package]
name = "ulyn-sosmed"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.15.4"
axum = "0.8.8"
dotenvy = "0.15.7"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["fs"] }
tracing-subscriber = "0.3.22"
tracing = "0.1"
uuid = { version = "1.22.0", features = ["v4", "fast-rng", "serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono"] }
redis = { version = "0.27", features = ["tokio-comp", "tokio-rustls-comp"] }
chrono = { version = "0.4", features = ["serde"] }
scraper = "0.20"
urlencoding = "2.1"
regex = "1"
rand = "0.8"
rust-s3 = { version = "0.34", default-features = false, features = ["tokio-rustls-tls"] }
futures = "0.3.32"
